name: Fix Apnea canonical 2026-10-23 (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-apnea-canonical-20261023.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical and seal
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://acarolmourad-commits.github.io/asf-apnea/'
          n = s.count(old)
          if n == 0:
              print('canonical anchor not found'); sys.exit(1)
          s = s.replace(old, 'https://apnea.asf.surf/')
          banner = '<div style="background:#ffe9e9;border:1px solid #ffb3b3;color:#5c0000;padding:10px 14px;border-radius:10px;margin:12px auto;max-width:960px;font:600 14px/1.5 system-ui,sans-serif">✅ Atualizado em 23/10/2026 · ⚠️ Apneia: nunca treine apneia na água sozinha — treine em seco ou com supervisão direta de pessoa treinada.</div>'
          if 'Atualizado em 23/10/2026' not in s:
              s, cnt = re.subn(r'(<body[^>]*>)', r'\\1\n' + banner, s, count=1, flags=re.I)
              if cnt == 0:
                  print('body anchor not found'); sys.exit(1)
          p.write_text(s, encoding='utf-8')
          print(f'replaced {n} canonical/OG URLs')
          PY
      - name: Commit and push if changed
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'ASF Bot'
          git config user.email 'bot@asf-app.com'
          git add index.html
          git commit -m 'fix(seo): canonical apnea.asf.surf e selo 23/10/2026'
          git push
